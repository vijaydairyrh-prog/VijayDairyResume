<style>
  :root {
    --green-dark: #0f5c2e;
    --green: #1f9648;
    --green-light: #e9f7ee;
    --maroon: #7a1330;
    --maroon-dark: #5c0e24;
    --gold: #f0b429;
    --ink: #22282b;
    --muted: #6b7580;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', Arial, sans-serif;
    background: linear-gradient(160deg, var(--green-dark) 0%, var(--green) 45%, var(--maroon-dark) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 15px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08) 0, transparent 40%),
                       radial-gradient(circle at 85% 80%, rgba(240,180,41,0.15) 0, transparent 45%);
    pointer-events: none;
  }
  .card {
    background: #fff;
    max-width: 600px;
    width: 100%;
    border-radius: 18px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  .card-header {
    background: linear-gradient(135deg, #fff 0%, var(--green-light) 100%);
    padding: 30px 30px 22px;
    text-align: center;
    border-bottom: 4px solid var(--gold);
  }
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .brand-row .brand-logo-main {
    height: 78px;
    object-fit: contain;
  }
  .brand-row .brand-logo-side {
    height: 46px;
    object-fit: contain;
    opacity: 0.92;
  }
  .brand-divider {
    width: 1px;
    height: 44px;
    background: linear-gradient(to bottom, transparent, #c9d4cc, transparent);
  }
  .group-tag {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.3px;
    margin-bottom: 8px;
  }
  .card-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 21px;
    color: var(--maroon);
    letter-spacing: 0.3px;
  }
  .card-header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .card-body { padding: 32px 30px 26px; }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--green-dark);
    margin: 0 0 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid #eef2ee;
  }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid #dfe4e8;
    border-radius: 9px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fbfcfc;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(31,150,72,0.15);
    background: #fff;
  }
  textarea { resize: vertical; min-height: 90px; }
  .row { display: flex; gap: 14px; }
  .row .field { flex: 1; }
  button[type="submit"] {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--maroon), var(--maroon-dark));
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 8px 18px rgba(122,19,48,0.3);
  }
  button[type="submit"]:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(122,19,48,0.4); }
  button[type="submit"]:disabled { background: #9aa7b8; box-shadow: none; cursor: not-allowed; transform: none; }
  #msg {
    margin-top: 14px;
    padding: 12px;
    border-radius: 9px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  #msg.success { background: #e3f7e9; color: #1a7d3a; display: block; }
  #msg.error { background: #fdeaea; color: #c0392b; display: block; }
  .hr-link { text-align: center; margin-top: 18px; font-size: 13px; }
  .hr-link a {
    color: var(--maroon);
    text-decoration: none;
    font-weight: 600;
    border-bottom: 1px dashed var(--maroon);
    padding-bottom: 1px;
  }
  .footer-strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    background: var(--green-light);
    font-size: 11px;
    color: var(--muted);
  }
  .footer-strip img { height: 22px; }
  /* ---- Mobile responsiveness ---- */
  @media (max-width: 600px) {
    body { padding: 0; align-items: flex-start; }
    .card { border-radius: 0; min-height: 100vh; box-shadow: none; }
    .card-header { padding: 22px 18px 16px; }
    .card-body { padding: 22px 18px 20px; }
    .brand-row { gap: 10px; }
    .brand-row .brand-logo-main { height: 58px; }
    .brand-row .brand-logo-side { height: 34px; }
    .brand-divider { height: 32px; }
    .card-header h1 { font-size: 18px; }
    .card-header p { font-size: 12px; }
    .row { flex-direction: column; gap: 0; }
    input, select, textarea { font-size: 16px; } /* prevents iOS zoom-on-focus */
    button[type="submit"] { padding: 15px; font-size: 16px; }
    .footer-strip { flex-wrap: wrap; text-align: center; padding: 12px; }
  }
  @media (max-width: 360px) {
    .brand-row .brand-logo-main { height: 48px; }
    .brand-row .brand-logo-side { height: 28px; }
    .group-tag { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="card">

<script>
// Replace this with YOUR deployed Google Apps Script Web App URL
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXzPG2BIoQHuPISK-k_0NlFIIS3SqofTE6qD-BRFAlGJrbrJK_1kS0aUIflWuh_UPsjg/exec";

const form = document.getElementById('applicationForm');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";
  msg.style.display = 'none';

  const payload = {
    action: 'submitApplication',
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    position: document.getElementById('position').value,
    experience: document.getElementById('experience').value,
    education: document.getElementById('education').value,
    coverLetter: document.getElementById('coverLetter').value
  };

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (data.status === 'success') {
      msg.className = 'success';
      msg.textContent = "✅ Application submitted successfully! We'll get back to you soon.";
      form.reset();
    } else {
      msg.className = 'error';
      msg.textContent = "❌ " + (data.message || "Something went wrong. Please try again.");
    }
  } catch (err) {
    msg.className = 'error';
    msg.textContent = "❌ Could not connect. Check the Apps Script URL and try again.";
  }

  submitBtn.disabled = false;
  submitBtn.textContent = "Submit Application";
});
</script>
